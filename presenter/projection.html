<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Agent Runtime · 投影</title><link rel="stylesheet" href="styles.css"><script type="module" src="projection.mjs"></script></head>
<body class="projection">
  <main class="projection__stage" aria-label="投影片"><img id="projected-slide" class="projection__image" alt="等待講者選擇投影片" hidden></main>
  <div class="projection__setup" id="projection-setup"><button class="button button--primary" id="enter-fullscreen">全螢幕，只顯示圖片</button><p id="projection-hint" role="status">將這個視窗移到投影螢幕，按 L 或點擊按鈕。Esc 可退出全螢幕。</p></div>

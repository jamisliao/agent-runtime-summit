<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>58頁 Evaluation介紹</title><style>body{margin:0;background:#181818;color:#182849;font:20px system-ui}main{max-width:1672px;margin:auto}figure{margin:0 0 20px}img{display:block;width:100%;height:auto;max-height:100vh;object-fit:contain}article{background:#fffdf7;margin:0 0 30px;padding-bottom:20px}h2,article p,article ul{margin:20px}header{background:#eee9df;padding:20px}@media print{figure{break-after:page;margin:0}}</style></head><body><main><figure id="slide-01"><img loading="lazy" src="slide-01.png?v=fd647e3d9d8e" width="1672" height="941" alt="自己刻 Agent 框架，最難的不是呼叫 LLM"></figure><figure id="slide-02"><img loading="lazy" src="slide-02.png?v=4f3bb2de4420" width="1672" height="941" alt="這個 Tool Loop，幾行程式碼就能跑起來"></figure><figure id="slide-03"><img loading="lazy" src="slide-03.png?v=5ae09a8d097a" width="1672" height="941" alt="你以為這樣就結束了嗎？"></figure><figure id="slide-04"><img loading="lazy" src="slide-04.png?v=26ff9b0a321a" width="1672" height="941" alt="會動之後，六個問題攤開了"></figure><figure id="slide-05"><img loading="lazy" src="slide-05.png?v=dd6e7c2b506c" width="1672" height="941" alt="為什麼選擇自己刻？"></figure><figure id="slide-06"><img loading="lazy" src="slide-06.png?v=2e714eebfdb8" width="1672" height="941" alt="第一個問題：工具結果，怎麼交回模型？"></figure><figure id="slide-07"><img loading="lazy" src="slide-07.png?v=59044960eb7b" width="1672" height="941" alt="每輪都 append，Context 越堆越多"></figure><figure id="slide-08"><img loading="lazy" src="slide-08.png?v=df87312d77c5" width="1672" height="941" alt="工具結果留完整，給模型的內容按需準備"></figure><figure id="slide-09"><img loading="lazy" src="slide-09.png?v=85a0f1fc65c9" width="1672" height="941" alt="模型傳 Ref，工具取完整資料"></figure><figure id="slide-10"><img loading="lazy" src="slide-10.png?v=18c9dd593879" width="1672" height="941" alt="查線上問題，卻把 Context 塞爆了"></figure><figure id="slide-11"><img loading="lazy" src="slide-11.png?v=7da81ebf3f1c" width="1672" height="941" alt="Log 先篩選，再放進 Context"></figure><figure id="slide-12"><img loading="lazy" src="slide-12.png?v=6a1c0df2154e" width="1672" height="941" alt="控制 Context，不只是為了省 Token"></figure><figure id="slide-13"><img loading="lazy" src="slide-13.png?v=2e4765111c66" width="1672" height="941" alt="資訊放在中間，也容易被 LLM 忽略"></figure><figure id="slide-14"><img loading="lazy" src="slide-14.png?v=684e9c5e548e" width="1672" height="941" alt="30k Context，迫使我換成更大的模型"></figure><figure id="slide-15"><img loading="lazy" src="slide-15.png?v=6a96d5ac65ac" width="1672" height="941" alt="Context 管理會影響需要多大的模型"></figure><figure id="slide-16"><img loading="lazy" src="slide-16.png?v=7b6ec354cc0c" width="1672" height="941" alt="分析完 Log，任務就完成了嗎？"></figure><figure id="slide-17"><img loading="lazy" src="slide-17.png?v=de16104ed376" width="1672" height="941" alt="正式報告，需要由 Builder 產生"></figure><figure id="slide-18"><img loading="lazy" src="slide-18.png?v=c4be7f4505e1" width="1671" height="941" alt="我已在 Skill 寫明：分析後呼叫 Builder"></figure><figure id="slide-19"><img loading="lazy" src="slide-19.png?v=2d11e39a9381" width="1672" height="941" alt="模型卻跳過 Builder，自己寫了摘要"></figure><figure id="slide-20"><img loading="lazy" src="slide-20.png?v=7b8b73383284" width="1672" height="941" alt="有回答，不代表流程正確完成。"></figure><figure id="slide-21"><img loading="lazy" src="slide-21.png?v=44250b00ed5d" width="1671" height="941" alt="怎麼知道 Agent 真的完成任務？"></figure><figure id="slide-22"><img loading="lazy" src="slide-22.png?v=34fcec987808" width="1672" height="941" alt="Evaluation：實際測試 LLM 的表現"></figure><figure id="slide-23"><img loading="lazy" src="slide-23.png?v=d0ad8b5d2be2" width="1672" height="941" alt="測試跑完，怎麼確認達標？"></figure><figure id="slide-24"><img loading="lazy" src="slide-24.png?v=30cec67af813" width="1672" height="941" alt="結果完成了，流程也做對了嗎？"></figure><figure id="slide-25"><img loading="lazy" src="slide-25.png?v=7d2df9ba0448" width="1672" height="941" alt="這些要求，要怎麼評估？"></figure><figure id="slide-26"><img loading="lazy" src="slide-26.png?v=7986c5c2cc83" width="1672" height="941" alt="把明確要求，做成程式檢查"></figure><figure id="slide-27"><img loading="lazy" src="slide-27.png?v=62e1273e45e1" width="1672" height="941" alt="固定條件重跑，觀察流程是否穩定"></figure><figure id="slide-28"><img loading="lazy" src="slide-28.png?v=c95bd780db9a" width="1672" height="941" alt="這批測試全過，不代表下次一定照做"></figure><figure id="slide-29"><img loading="lazy" src="slide-29.png?v=530dc366139c" width="1672" height="941" alt="不能接受的錯，就不能只靠模型遵守"></figure><figure id="slide-30"><img loading="lazy" src="slide-30.png?v=ddffd793837a" width="1672" height="941" alt="把不可接受的錯，變成可檢查的條件"></figure><figure id="slide-31"><img loading="lazy" src="slide-31.png?v=9b5f57be6ef9" width="1672" height="941" alt="同一份 Log 報告，還可能多出沒有依據的內容"></figure><figure id="slide-32"><img loading="lazy" src="slide-32.png?v=7865f25fee39" width="1672" height="941" alt="每一項結論，都要對回 Tool Result"></figure><figure id="slide-33"><img loading="lazy" src="slide-33.png?v=093084df7ec2" width="1672" height="941" alt="沒有對應證據的結論，不能進正式報告"></figure><figure id="slide-34"><img loading="lazy" src="slide-34.png?v=fa1c6cc11912" width="1672" height="941" alt="有些決定，不能讓 Agent 自己確認"></figure><figure id="slide-35"><img loading="lazy" src="slide-35.png?v=eeb7455758f4" width="1672" height="941" alt="先確認理解，避免做完錯誤的任務"></figure><figure id="slide-36"><img loading="lazy" src="slide-36.png?v=ac5086bf9b66" width="1672" height="941" alt="寫入、扣款或對外通知，執行前要先批准"></figure><figure id="slide-37"><img loading="lazy" src="slide-37.png?v=757e40c9a25e" width="1672" height="941" alt="批准後，執行前仍要重新檢查條件"></figure><figure id="slide-38"><img loading="lazy" src="slide-38.png?v=cf4849f7c992" width="1672" height="941" alt="有人審核，任務仍可能出錯"></figure><figure id="slide-39"><img loading="lazy" src="slide-39.png?v=27463e6c178f" width="1672" height="941" alt="發現漏了 Builder，還要查它怎麼發生"></figure><figure id="slide-40"><img loading="lazy" src="slide-40.png?v=99664d7be6f9" width="1672" height="941" alt="先留下 AI 能協助追查的資訊"></figure><figure id="slide-41"><img loading="lazy" src="slide-41.png?v=5d6b813de416" width="1672" height="941" alt="漏了 Builder，要對照哪些紀錄？"></figure><figure id="slide-42"><img loading="lazy" src="slide-42.png?v=a01219fac3ae" width="1672" height="941" alt="把執行紀錄交給 AI，協助找線索"></figure><figure id="slide-43"><img loading="lazy" src="slide-43.png?v=fb9818616c62" width="1672" height="941" alt="提出修改，再用 Evaluation 驗證"></figure><figure id="slide-44"><img loading="lazy" src="slide-44.png?v=b7faa780f615" width="1672" height="941" alt="改完 Skill，整次任務都要重新測"></figure><figure id="slide-45"><img loading="lazy" src="slide-45.png?v=d264e42c17d2" width="1672" height="941" alt="改完之後，報告符合要求了嗎？"></figure><figure id="slide-46"><img loading="lazy" src="slide-46.png?v=6c252cf3d334" width="1672" height="941" alt="漏掉的 Builder，這次有呼叫嗎？"></figure><figure id="slide-47"><img loading="lazy" src="slide-47.png?v=771542e69651" width="1672" height="941" alt="呼叫了 Builder，傳入的資料也對嗎？"></figure><figure id="slide-48"><img loading="lazy" src="slide-48.png?v=d063b917bf12" width="1672" height="941" alt="驗收修改：哪些用程式，哪些用 Judge？"></figure><figure id="slide-49"><img loading="lazy" src="slide-49.png?v=771ac59d3c62" width="1672" height="941" alt="踩過的坑，留進回歸測試"></figure><figure id="slide-50"><img loading="lazy" src="slide-50.png?v=1d6eae4bf8b4" width="1672" height="941" alt="通過幾次，才接受這版修改？"></figure><figure id="slide-51"><img loading="lazy" src="slide-51.png?v=192ae099d684" width="1672" height="941" alt="修好一個問題，也可能弄壞其他情境。"></figure><figure id="slide-52"><img loading="lazy" src="slide-52.png?v=919ea13a7e38" width="1672" height="941" alt="從第一版 Skill 到功能完成，我沒有手寫過一行 Prompt。"></figure><figure id="slide-53"><img loading="lazy" src="slide-53.png?v=28277fcdba3f" width="1672" height="941" alt="Eval 的價值不是分數，而是讓 Skill 能被持續修正。"></figure><figure id="slide-54"><img loading="lazy" src="slide-54.png?v=193fd369f33d" width="1672" height="941" alt="人定義成功標準，修改用測試結果驗收"></figure><figure id="slide-55"><img loading="lazy" src="slide-55.png?v=24465fba4844" width="1672" height="941" alt="每輪產生、測試與修正，都要留下成本紀錄"></figure><figure id="slide-56"><img loading="lazy" src="slide-56.png?v=31fb9c8a93a4" width="1672" height="941" alt="寫出一個 Loop 很簡單，讓一個 Loop 能夠正確地完成任務，才是困難的工程問題。"></figure><figure id="slide-57"><img loading="lazy" src="slide-57.png?v=99042585ee51" width="1672" height="941" alt="解決這個問題，不能只靠最新的模型。"></figure><figure id="slide-58"><img loading="lazy" src="slide-58.png?v=81eee29357f1" width="1672" height="941" alt="模型會越來越聰明，但是你的口袋沒有越來越深。"></figure></main></body></html>
